<svg width="32" height="32" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bgRect {
      fill: #ffffff;
      stroke: transparent;
      stroke-width: 0;
    }
    .logoStroke {
      stroke: #191919;
    }

    @media (prefers-color-scheme: light) {
      .bgRect {
        fill: #191919;
        stroke: transparent;
        stroke-width: 0;
      }
      .logoStroke {
        stroke: #ffffff;
      }
    }
  </style>

  <!-- Main Notion-style squircle card -->
  <rect width="28" height="28" rx="4" class="bgRect" />

  <!-- Left code bracket < -->
  <path
    d="M7.5 9.5L3.5 14L7.5 18.5"
    class="logoStroke"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right code bracket > -->
  <path
    d="M20.5 9.5L24.5 14L20.5 18.5"
    class="logoStroke"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dynamic Practice Slash -->
  <path
    d="M16 7.5L12 20.5"
    class="logoStroke"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
