name: Cleanup merged branches

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches fully merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --prune --tags
          merged="$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)' | sed 's|^[[:space:]]*origin/||' | grep -v '^$')"
          if [ -z "$merged" ]; then
            echo "No merged branches to clean up."
            exit 0
          fi
          for branch in $merged; do
            case "$branch" in
              main|develop|gh-pages)
                continue
                ;;
            esac
            echo "Deleting merged branch: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
