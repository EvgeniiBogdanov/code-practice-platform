<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Тренажёр frontend-собеседований: задачи по JavaScript, TypeScript, React и алгоритмам в редакторе уровня VS Code, эталонные решения, индекс вероятности на интервью и интервальные повторения." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Code Practice Platform — тренажёр frontend-собеседований" />
    <meta property="og:description" content="Задачи с реальных интервью, живой запуск React 19, эталонные решения и интервальные повторения. Локальный аккаунт — только имя." />
    <title>Code Practice Platform — тренажёр frontend-собеседований</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/src/app/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/app/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/app/styles/fonts.css" />
    <script>
      (function() {
        var preference = 'system';
        var sidebarWidth = 280;
        try {
          var raw = localStorage.getItem('playground_ui_settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) {
              var storedPreference = parsed.state.themePreference === undefined
                ? parsed.state.theme
                : parsed.state.themePreference;
              if (storedPreference === 'system' || storedPreference === 'light' || storedPreference === 'dark') {
                preference = storedPreference;
              }
              if (typeof parsed.state.sidebarWidth === 'number' && parsed.state.sidebarWidth >= 200 && parsed.state.sidebarWidth <= 480) {
                sidebarWidth = parsed.state.sidebarWidth;
              }
            }
          } else {
            var legacy = localStorage.getItem('playground_theme');
            if (legacy === 'light' || legacy === 'dark') preference = legacy;
          }
        } catch (e) {}
        var theme = preference === 'system'
          ? (typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        // The landing is light-only: first paint must not flash the saved dark theme.
        try {
          var base = '%BASE_URL%'.replace(/\/+$/, '');
          var path = location.pathname;
          var isLandingPath = path === base || path === base + '/' || path === base + '/index.html';
          if (isLandingPath && !localStorage.getItem('code_practice_local_account')) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.setProperty('--sidebar-width', sidebarWidth + 'px');

      })();
    </script>
    <style>
      html, body {
        color-scheme: dark;
        background-color: #191919;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        color-scheme: light;
        background-color: #ffffff;
      }
      /* Smooth hand-over between the landing and the workspace: same-document swaps and full navigations */
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 450ms;
        animation-timing-function: cubic-bezier(0.22, 0.7, 0.2, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
      .app-initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
      }
      /* Three equaliser bars, 36px tall (--size = height / 48) */
      .app-initial-bars {
        --size: 0.75px;
        position: relative;
        display: block;
        color: #a3a3a3;
        width: calc(8 * var(--size));
        height: calc(40 * var(--size));
        border-radius: calc(4 * var(--size));
        background: currentColor;
        animation: appInitialBars 0.3s 0.3s linear infinite alternate;
      }
      .app-initial-bars::before,
      .app-initial-bars::after {
        content: '';
        position: absolute;
        top: 50%;
        left: calc(20 * var(--size));
        width: calc(8 * var(--size));
        height: calc(40 * var(--size));
        border-radius: calc(4 * var(--size));
        background: currentColor;
        transform: translateY(-50%);
        animation: appInitialBars 0.3s 0.45s linear infinite alternate;
      }
      .app-initial-bars::before {
        left: calc(-20 * var(--size));
        animation-delay: 0s;
      }
      html[data-theme="light"] .app-initial-bars {
        color: #0a0a0a;
      }
      @keyframes appInitialBars {
        0% { height: calc(48 * var(--size)); }
        100% { height: calc(4 * var(--size)); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader" role="status" aria-label="Загрузка приложения...">
        <span class="app-initial-bars" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
