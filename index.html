<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Practice Platform</title>
    <!-- Подключаем Inter (для стиля Standard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Подключаем Geist и Geist Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('playground_ui_settings');
          var theme = 'dark';
          var sidebarWidth = 280;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) {
              if (parsed.state.theme === 'light' || parsed.state.theme === 'dark') {
                theme = parsed.state.theme;
              }
              if (typeof parsed.state.sidebarWidth === 'number' && parsed.state.sidebarWidth >= 200 && parsed.state.sidebarWidth <= 480) {
                sidebarWidth = parsed.state.sidebarWidth;
              }
            }
          } else {
            var legacy = localStorage.getItem('playground_theme');
            if (legacy === 'light' || legacy === 'dark') theme = legacy;
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.setProperty('--sidebar-width', sidebarWidth + 'px');
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #191919;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #fbfbfa;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
