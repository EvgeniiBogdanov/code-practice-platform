<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Интерактивная платформа для практики JavaScript, React и алгоритмов с онлайн-редактором, тестами и системой интервального повторения." />
    <title>Code Practice Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Подключение шрифта Inter с оптимизацией предзагрузки -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('playground_ui_settings');
          var theme = 'dark';
          var sidebarWidth = 280;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) {
              if (parsed.state.theme === 'light' || parsed.state.theme === 'dark') {
                theme = parsed.state.theme;
              }
              if (typeof parsed.state.sidebarWidth === 'number' && parsed.state.sidebarWidth >= 200 && parsed.state.sidebarWidth <= 480) {
                sidebarWidth = parsed.state.sidebarWidth;
              }
            }
          } else {
            var legacy = localStorage.getItem('playground_theme');
            if (legacy === 'light' || legacy === 'dark') theme = legacy;
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.setProperty('--sidebar-width', sidebarWidth + 'px');
        } catch (e) {}

        if (typeof document !== 'undefined' && 'fonts' in document && typeof document.fonts.load === 'function') {
          try {
            document.fonts.load('400 1em Inter');
            document.fonts.load('500 1em Inter');
            document.fonts.load('600 1em Inter');
          } catch (e) {}
        }
      })();
    </script>
    <style>
      html, body {
        background-color: #191919;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #fbfbfa;
      }
      @keyframes appInitialSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .app-initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
      }
      .app-initial-spinner {
        width: 36px;
        height: 36px;
        animation: appInitialSpin 0.75s linear infinite;
        color: #94a3b8;
      }
      html[data-theme="light"] .app-initial-spinner {
        color: #787774;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader" role="status" aria-label="Загрузка приложения...">
        <svg class="app-initial-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2.2" style="opacity: 0.15;" />
          <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2.2" stroke-dasharray="45 15" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
