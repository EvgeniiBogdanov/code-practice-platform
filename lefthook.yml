# Local mirror of the fast CI checks (CI stays the source of truth).
# Hooks install on `npm install`. Skip once: `LEFTHOOK=0 git commit ...`.

pre-commit:
  # Sequential: Prettier formats first, then ESLint checks the formatted files.
  piped: true
  jobs:
    - name: prettier
      glob: "*.{js,jsx,mjs,ts,tsx,json,css}"
      run: npx --no -- prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: eslint
      glob: "*.{js,jsx,mjs,ts,tsx}"
      run: npx --no -- eslint --fix --max-warnings 0 --cache --no-warn-ignored {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    # Branch name: <type>/<DD.MM.YY>[-N]-<description>, see docs/git-workflow.md
    - name: branch-name
      run: |
        branch=$(git branch --show-current)
        case "$branch" in ""|main|dependabot/*|release/*) exit 0 ;; esac
        pattern='^(feat|fix|hotfix|content|refactor|perf|docs|test|style|build|ci|chore)/([a-z0-9]+/)?(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.[0-9][0-9](-[2-9]|-[1-9][0-9]+)?-[a-z0-9]+(-[a-z0-9]+)*$'
        if ! printf '%s\n' "$branch" | grep -Eq "$pattern"; then
          echo "Branch name '$branch' does not match <type>/<DD.MM.YY>[-N]-<description>"
          echo "Example: fix/15.10.26-editor-undo-redo (see docs/git-workflow.md)"
          echo "Rename: git branch -m <new-name>   Skip once: LEFTHOOK_EXCLUDE=branch-name git push"
          exit 1
        fi

    - name: typecheck
      run: npm run typecheck
